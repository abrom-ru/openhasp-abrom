;***************************************************;
;   Waveshare ESP32-S3-Touch-LCD-4  hardware V4.0   ;
;               - ESP32-S3 N16R8, native USB        ;
;               - st7701s TFT 480x480 RGB           ;
;               - gt911 touch controller            ;
;               - CH32V003 IO expander @0x24:       ;
;                 LCD/touch reset, backlight PWM    ;
;***************************************************;
; NOT the Guition 4848S040: different pinout, no CH340, backlight via CH32V003.
; Pins from Waveshare BSP waveshare/esp32_s3_touch_lcd_4 ^2 (V4.0 hardware).

[waveshare-s3-lcd4-v4]
extends = arduino_esp32s3_v2
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi

build_flags =
    -D HASP_MODEL="Waveshare ESP32-S3-Touch-LCD-4 V4"
    ${arduino_esp32s3_v2.build_flags}
    ${esp32s3.ps_ram}
    ; console on UART like the factory firmware, NOT on native USB (CDC_ON_BOOT blocks boot for minutes)
    -D WAVESHARE_LCD4_V4=1       ; selects dev::WaveshareLcd4V4 (CH32V003 init + backlight)
    -D LVGL_FREETYPE_MAX_BYTES_PSRAM=1048576
    -D LV_DISP_DEF_REFR_PERIOD=30

;region -- ArduinoGFX build options ------------------------
    -D HASP_USE_ARDUINOGFX=1
    -D ST7701_DRIVER=1           ; generic st7701_type1 init, same as Waveshare Arduino examples
    -D TFT_WIDTH=480
    -D TFT_HEIGHT=480
    -D HASP_DEFAULT_ROTATION=2   ; panel is mounted upside down; GFX flips the image, LVGL the touch
    ; Bus Settings
    -D TFT_CS=42
    -D TFT_SCLK=2
    -D TFT_MOSI=1
    -D TFT_DE=40
    -D TFT_VSYNC=39
    -D TFT_HSYNC=38
    -D TFT_PCLK=41
    -D TFT_R0=46
    -D TFT_R1=3
    -D TFT_R2=8
    -D TFT_R3=18
    -D TFT_R4=17
    -D TFT_G0=14
    -D TFT_G1=13
    -D TFT_G2=12
    -D TFT_G3=11
    -D TFT_G4=10
    -D TFT_G5=9
    -D TFT_B0=5
    -D TFT_B1=45
    -D TFT_B2=48
    -D TFT_B3=47
    -D TFT_B4=21
    -D TFT_DC=-1
    -D TFT_MISO=-1
    -D TFT_RST=-1                ; on CH32V003
    -D TFT_BUSY=-1
    ; no TFT_BCKL: backlight is the CH32V003 PWM register
    ; Panel Settings
    -D TFT_HSYNC_POLARITY=1
    -D TFT_HSYNC_FRONT_PORCH=10
    -D TFT_HSYNC_PULSE_WIDTH=8
    -D TFT_HSYNC_BACK_PORCH=50
    -D TFT_VSYNC_POLARITY=1
    -D TFT_VSYNC_FRONT_PORCH=10
    -D TFT_VSYNC_PULSE_WIDTH=8
    -D TFT_VSYNC_BACK_PORCH=20
    -D TFT_PCLK_ACTIVE_NEG=0
    -D TFT_PREFER_SPEED=16000000
    -D TFT_AUTO_FLUSH=1
    ; Touch Settings
    -D TOUCH_DRIVER=0x911
    -D TOUCH_WIDTH=480
    -D TOUCH_HEIGHT=480
    -D TOUCH_SDA=15
    -D TOUCH_SCL=7
    -D TOUCH_RST=-1              ; on CH32V003
    -D TOUCH_IRQ=-1              ; on CH32V003
    -D I2C_TOUCH_FREQUENCY=400000
    -D I2C_TOUCH_ADDRESS=0x5D    ; or 0x14
;endregion

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${arduinogfx.lib_deps}
    ${goodix.lib_deps}

[env:waveshare-s3-lcd4-v4_16MB]
extends = waveshare-s3-lcd4-v4, flash_16mb
